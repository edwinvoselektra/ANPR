# Explicit overlay for the existing HTTPS tunnel's test environment.
# Base docker-compose.yml remains the separate local development mode.
services:
  web:
    image: anpr-platform-web:external-test
    build:
      target: production
      args:
        # Next rewrites are fixed during next build, not by runtime env alone.
        API_INTERNAL_URL: http://api:4000
    command: ["node", "apps/web/server.js"]
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
  api:
    image: anpr-platform-api:external-test
    build:
      target: production
    command: ["node", "apps/api/dist/server.js"]
    # Existing workers/media use root-owned 0600 files. Preserve that UID in
    # this test overlay; changing all storage ownership is a separate migration.
    user: "0:0"
    environment:
      NODE_ENV: production
      WEB_ORIGIN: https://anpr.vanmilligentechniek.com
